[project]
name = "jdluc"
version = "0.1.0"
description = "Cornerstone LUC: high-resolution jurisdictional direct LUC methodology, and pipeline for US crops."
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "GitPython",
    "bokeh",
    "dask",
    "distributed",
    "gcsfs",
    "geopandas",
    "iso3166",
    "netCDF4",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "requests",
    "rio-cogeo",
    "rioxarray",
    "xarray",
    "zarr",
]

[dependency-groups]
dev = [
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "pytest",
    "types-geopandas",
    "types-networkx",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-s -v -m 'not integration'"
markers = [
    "integration: tests requiring live GCS credentials; excluded by default (run with `-m integration`).",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
log_cli_level = "INFO"

[[tool.mypy.overrides]]
module = [
    "rasterio",
    "rasterio.*",
]
ignore_missing_imports = true
follow_imports = "skip"
implicit_reexport = true

[tool.importlinter]
root_packages = ["jdluc", "validation"]

[[tool.importlinter.contracts]]
name = "The pipeline never imports the validator"
type = "forbidden"
source_modules = [
    "jdluc",
]
forbidden_modules = [
    "validation",
]

[[tool.importlinter.contracts]]
name = "ETL"
type = "layers"
layers = [
    "jdluc.trace",
    "jdluc.attribute",
    "jdluc.jurisdictional_direct | jdluc.statistical",
    "jdluc.emit",
    "jdluc.harmonize",
    "jdluc.ingest",
]

[[tool.importlinter.contracts]]
name = "Utilities are foundational"
type = "forbidden"
source_modules = [
    "jdluc.config",
    "jdluc.geo",
    "jdluc.storage",
    "jdluc.tiling",
    "jdluc.utils",
]
forbidden_modules = [
    "jdluc.attribute",
    "jdluc.emit",
    "jdluc.harmonize",
    "jdluc.ingest",
    "jdluc.jurisdictional_direct",
    "jdluc.statistical",
    "jdluc.trace",
    "jdluc.datasets",
]

[[tool.importlinter.contracts]]
name = "Datasets never import the pipeline"
type = "forbidden"
source_modules = [
    "jdluc.datasets",
]
forbidden_modules = [
    "jdluc.attribute",
    "jdluc.emit",
    "jdluc.harmonize",
    "jdluc.ingest",
    "jdluc.jurisdictional_direct",
    "jdluc.statistical",
    "jdluc.trace",
]
